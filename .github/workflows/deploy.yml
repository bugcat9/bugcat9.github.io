name: Hexo Deploy

on:
  push:
    branches:
      - hexo

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: hexo
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Hexo
        run: |
          git config --global user.email "1767508581@qq.com"
          git config --global user.name "bugcat9"
          npm install hexo-cli -g
          npm ci

      - name: Configure deploy remote for Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i "s#repo: git@github.com:bugcat9/bugcat9.github.io.git#repo: https://x-access-token:${GH_TOKEN}@github.com/bugcat9/bugcat9.github.io.git#" _config.yml

      - name: Set gitalk
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          sed -i "642s/123/$CLIENT_ID/" ./themes/next/_config.yml
          sed -i "643s/123/$CLIENT_SECRET/" ./themes/next/_config.yml

      - name: Deploy
        run: |
          hexo clean
          hexo deploy
